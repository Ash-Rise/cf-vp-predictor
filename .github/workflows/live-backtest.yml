name: Codeforces Delta backtest (manual)

on:
  workflow_dispatch:

jobs:
  live-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime packages
        run: python -m pip install -r requirements.txt
      - name: Reproduce leave-one-out results (ten contests, 25 samples each)
        run: python backtest.py
