name: Live Delta backtest (one-off)

on: push

jobs:
  live-backtest:
    if: github.event.head_commit.message == 'Run one-time real Codeforces Delta backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime packages
        run: python -m pip install -r requirements.txt
      - name: Run ten-contest leave-one-out backtest (25 sampled players each)
        run: python backtest.py
