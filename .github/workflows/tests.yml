name: Small regression tests

on:
  push:
  pull_request:

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q app.py vp_utils.py rating_rules.py persistent_handle.py
      - name: Run focused tests (no Codeforces API calls)
        run: python -m unittest discover -v -p 'test_*.py'
