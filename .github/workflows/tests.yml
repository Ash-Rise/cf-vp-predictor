name: Small regression and Streamlit smoke tests

on:
  push:
  pull_request:

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax and real module imports
        run: |
          python -m compileall -q app.py vp_utils.py rating_rules.py persistent_handle.py cf_api.py predictor_core.py
          python -c "import cf_api, predictor_core, vp_utils, rating_rules, persistent_handle"
      - name: Small offline unit and app startup tests
        run: python -m unittest discover -v -p 'test_*.py'
